# Shared by every service, all profiles. Never put secrets here; reference ${ENV_VARS} instead.

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    # Register container IPs, so the gateway and Feign reach each instance directly.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    # Every log line carries the service name and the request ID (PLAT-09).
    level: "%5p [${spring.application.name:-},%X{requestId:-}]"

# Resilience defaults (REQUIREMENTS.md A-25). Refreshable; tuned after measuring.
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-rate-threshold: 50
        slow-call-duration-threshold: 2s
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

# Access tokens (FR-AUTH-06). identity-service signs them; every service verifies them locally with
