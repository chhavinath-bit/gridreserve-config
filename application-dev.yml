# Local development (docker compose / IDE).
logging:
  level:
    com.gridreserve: DEBUG

management:
  endpoints:
    web:
      exposure:
        # dev only: per-instance counters for the concurrency system test (CONC-10, M1.8) and refresh for
        # scripts/refresh-config.sh (M1.9). Admin or service token required; the gateway never routes
        # /actuator to services. prod keeps health and info only until the deploy milestone decides.
        include: health,info,metrics,refresh
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    # Faster registration and removal while developing.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    # Callers refresh their copy of the registry every 5 s (default 30 s).
    registry-fetch-interval-seconds: 5

spring:
  cloud:
    loadbalancer:
      cache:
        # The load balancer caches instance lists; default 35 s delays routing after a fresh start.
        ttl: 5s

gridreserve:
  web:
    # The Vite dev server. Refresh and logout accept only this Origin (FR-AUTH-12); CORS at the gateway will too.
    frontend-origin: http://localhost:5173
