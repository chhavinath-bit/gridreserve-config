# Local development (docker compose / IDE).
logging:
  level:
    com.gridreserve: DEBUG

management:
  endpoint:
    health:
      show-details: always

eureka:
  instance:
    # Faster registration and removal while developing.
    lease-renewal-interval-in-seconds: 5
    lease-expiration-duration-in-seconds: 15
  client:
    # Callers refresh their copy of the registry every 5 s (default 30 s).
    registry-fetch-interval-seconds: 5

spring:
  cloud:
    loadbalancer:
      cache:
        # The load balancer caches instance lists; default 35 s delays routing after a fresh start.
        ttl: 5s
